<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Chat (Final UI Fix)</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-color: #4a90e2;
            --bg-color: #f0f2f5;
            --chat-bg: #ffffff;
            --text-color: #333;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        /* Containers */
        .container { width: 100%; max-width: 400px; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: none; }
        .active-screen { display: block; }
        
        /* Chat Layout (โครงเดิมที่พี่ชอบ) */
        #chatScreen { max-width: 900px; width: 90%; height: 90vh; display: none; grid-template-columns: 300px 1fr; overflow: hidden; padding: 0; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); background: white; }
        .sidebar { background: #f7f7f7; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
        .chat-area { display: flex; flex-direction: column; background: var(--chat-bg); position: relative; }

        /* UI Elements */
        h2 { text-align: center; color: var(--text-color); margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; outline: none; }
        button { width: 100%; padding: 12px; background: var(--primary-color); color: white; border: none; border-radius: 5px; cursor: pointer; transition: 0.2s; font-size: 16px; margin-top: 10px; }
        button:hover { opacity: 0.9; }
        .secondary-btn { background: #ccc; color: #333; }
        .link-text { text-align: center; margin-top: 15px; font-size: 14px; cursor: pointer; color: var(--primary-color); }
        .error { color: #d9534f; font-size: 13px; text-align: center; margin-top: 5px; }

        /* Header UI (แบบมีปุ่มบวก) */
        .header { padding: 15px; background: var(--primary-color); color: white; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); z-index: 10; }
        .icon-btn { width: 40px; height: 40px; border-radius: 50%; padding: 0; display: flex; justify-content: center; align-items: center; font-size: 18px; margin: 0 0 0 5px; background: white; color: var(--primary-color); box-shadow: 0 2px 5px rgba(0,0,0,0.1); cursor: pointer; border: none; }
        .icon-btn:hover { background: #f0f0f0; }

        /* User List Items (แก้ให้ไม่ชิดกัน + มีรูป + มีเวลา) */
        .user-item { padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: background 0.2s; }
        .user-item:hover, .user-item.active { background: #eef; }
        
        .avatar { width: 45px; height: 45px; background: #ddd; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #555; overflow: hidden; flex-shrink: 0; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }

        .user-details { flex: 1; overflow: hidden; }
        .user-row-top { display: flex; justify-content: space-between; align-items: center; }
        .user-name { font-weight: bold; font-size: 15px; }
        .user-uid { font-size: 12px; color: #666; font-weight: normal; margin-left: 5px; }
        .msg-time { font-size: 11px; color: #999; }
        .last-msg { font-size: 13px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

        /* Chat Messages */
        .messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #f9f9f9; }
        .message { padding: 10px 15px; border-radius: 15px; max-width: 70%; word-wrap: break-word; font-size: 14px; line-height: 1.4; }
        .my-msg { align-self: flex-end; background: var(--primary-color); color: white; border-bottom-right-radius: 2px; }
        .their-msg { align-self: flex-start; background: #e0e0e0; color: #333; border-bottom-left-radius: 2px; }
        .chat-image { max-width: 100%; border-radius: 10px; margin-top: 5px; cursor: pointer; display: block; }
        
        .input-area { padding: 10px 15px; background: white; border-top: 1px solid #ddd; display: flex; gap: 10px; align-items: center; }

        /* Video Call */
        #videoCallModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 2000; display: none; flex-direction: column; }
        .video-container { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; }
        video { width: 100%; height: 100%; object-fit: cover; }
        #remoteVideo { width: 100%; height: 100%; }
        #localVideo { position: absolute; bottom: 20px; right: 20px; width: 120px; height: 160px; background: #333; border: 2px solid white; border-radius: 10px; z-index: 10; object-fit: cover; }
        .call-controls { position: absolute; bottom: 30px; width: 100%; display: flex; justify-content: center; gap: 20px; z-index: 20; }
        .call-btn { width: 60px; height: 60px; border-radius: 50%; font-size: 24px; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); border: none; cursor: pointer; color: white; }
        .btn-hangup { background: #ff4b5c; }

        /* Incoming Call */
        #incomingCallAlert { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: white; padding: 15px 25px; border-radius: 50px; box-shadow: 0 5px 20px rgba(0,0,0,0.3); z-index: 3000; display: none; align-items: center; gap: 15px; animation: slideDown 0.5s ease; width: 90%; max-width: 350px; }
        @keyframes slideDown { from { top: -100px; } to { top: 20px; } }
        .pulse { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(74, 144, 226, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(74, 144, 226, 0); } 100% { box-shadow: 0 0 0 0 rgba(74, 144, 226, 0); } }

        /* Modals */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 350px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .theme-selector { display: flex; gap: 10px; margin: 15px 0; justify-content: center; }
        .color-dot { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid #fff; box-shadow: 0 0 3px rgba(0,0,0,0.3); transition: transform 0.2s; }
        .history-list { max-height: 120px; overflow-y: auto; background: #f9f9f9; padding: 10px; border-radius: 5px; margin-bottom: 10px; font-size: 12px; color: #555; }
        .history-item { border-bottom: 1px solid #eee; padding: 5px 0; }

        /* Mobile */
        @media (max-width: 600px) {
            #chatScreen { width: 100%; height: 100%; border-radius: 0; grid-template-columns: 1fr; }
            .sidebar { display: flex; width: 100%; height: 100%; }
            .chat-area { display: none; width: 100%; height: 100%; position: absolute; top:0; left:0; z-index: 20; }
            .chat-area.active { display: flex; }
            .back-btn { display: inline-block !important; margin-right: 10px; cursor: pointer; font-size: 20px; }
        }
        .back-btn { display: none; color: white; }
    </style>
</head>
<body>

    <div id="loginScreen" class="container active-screen">
        <h2>เข้าสู่ระบบ</h2>
        <input type="email" id="loginEmail" placeholder="อีเมล">
        <input type="password" id="loginPass" placeholder="รหัสผ่าน">
        <div style="text-align:right; font-size:13px; margin-bottom:10px; cursor:pointer; color:#666;" onclick="resetPassword()">ลืมรหัสผ่าน?</div>
        <button onclick="login()">เข้าสู่ระบบ</button>
        <p class="link-text" onclick="showScreen('registerScreen')">ยังไม่มีบัญชี? สร้างบัญชีใหม่</p>
        <p id="loginError" class="error"></p>
    </div>

    <div id="registerScreen" class="container">
        <h2>สร้างบัญชีใหม่</h2>
        <input type="text" id="regUid" placeholder="ชื่อไอดี (@username)" pattern="^@.*">
        <input type="text" id="regNickname" placeholder="ชื่อเล่น">
        <input type="email" id="regEmail" placeholder="อีเมล">
        <input type="password" id="regPass" placeholder="รหัสผ่าน (6 ตัวขึ้นไป)">
        <input type="password" id="regConfirmPass" placeholder="ยืนยันรหัสผ่าน">
        <button onclick="register()">สมัครสมาชิก</button>
        <button class="secondary-btn" onclick="showScreen('loginScreen')">กลับไปหน้าล็อกอิน</button>
        <p id="regError" class="error"></p>
    </div>

    <div id="chatScreen">
        <div class="sidebar">
            <div class="header">
                <div style="display: flex; align-items: center; gap: 10px; overflow: hidden;">
                    <div id="myAvatarDisplay" class="avatar" style="width:35px; height:35px; border: 2px solid rgba(255,255,255,0.5);"><i class="fas fa-user"></i></div>
                    <span id="myProfileDisplay" style="font-weight:bold; white-space: nowrap;">Loading...</span>
                </div>
                <div style="display:flex;">
                    <button class="icon-btn" onclick="openAddFriendModal()" title="เพิ่มเพื่อน"><i class="fas fa-plus"></i></button>
                    <button class="icon-btn" onclick="openSettings()" title="ตั้งค่า"><i class="fas fa-cog"></i></button>
                </div>
            </div>
            
            <div id="friendsList" style="flex:1; overflow-y:auto;"></div>
        </div>

        <div id="chatArea" class="chat-area">
            <div class="header" id="chatHeader" style="background: white; color: #333; border-bottom: 1px solid #ddd;">
                <div style="display:flex; align-items:center;">
                    <i class="fas fa-arrow-left back-btn" style="color:#333;" onclick="closeChatMobile()"></i>
                    <span id="chatTitle">เลือกเพื่อนเพื่อเริ่มคุย</span>
                </div>
                <button id="callBtn" class="icon-btn" style="background:transparent; color:var(--primary-color); display:none;" onclick="startCallClick()">
                    <i class="fas fa-video" style="font-size:20px;"></i>
                </button>
            </div>
            <div id="messagesList" class="messages"></div>
            <div class="input-area">
                <label for="imgInput" style="cursor:pointer; color:#888; margin-right:5px;"><i class="fas fa-image" style="font-size:22px;"></i></label>
                <input type="file" id="imgInput" accept="image/*" style="display:none;" onchange="sendImage(this)">

                <input type="text" id="msgInput" placeholder="พิมพ์ข้อความ..." disabled oninput="onTyping()">
                <button onclick="sendMessage()" style="width: auto; margin:0; padding: 10px 20px;" id="sendBtn" disabled><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <div id="videoCallModal">
        <div class="video-container">
            <video id="remoteVideo" autoplay playsinline></video>
            <video id="localVideo" autoplay playsinline muted></video>
            <div class="call-controls">
                <button class="call-btn btn-hangup" onclick="hangUp()"><i class="fas fa-phone-slash"></i></button>
            </div>
            <div id="callStatusText" style="position:absolute; top:50px; color:white; background:rgba(0,0,0,0.5); padding:10px 20px; border-radius:20px;">Connecting...</div>
        </div>
    </div>

    <div id="incomingCallAlert">
        <div class="pulse" style="width:40px; height:40px; background:var(--primary-color); border-radius:50%; display:flex; justify-content:center; align-items:center; color:white;">
            <i class="fas fa-video"></i>
        </div>
        <div style="flex:1;">
            <div style="font-weight:bold;">สายเข้า...</div>
            <div id="incomingCallerName" style="font-size:12px; color:#666;">Unknown</div>
        </div>
        <button onclick="answerCall()" style="background:#2ecc71; width:auto; padding:8px 15px; font-size:13px; margin:0;">รับสาย</button>
        <button onclick="rejectCall()" style="background:#ff4b5c; width:auto; padding:8px 15px; font-size:13px; margin:0;">วางสาย</button>
    </div>

    <audio id="notifSound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

    <div id="addFriendModal" class="modal">
        <div class="modal-content">
            <h3><i class="fas fa-user-plus"></i> เพิ่มเพื่อนใหม่</h3>
            <input type="text" id="addFriendInput" placeholder="ค้นหาด้วย @username หรือ Email">
            <button onclick="addFriend()">เพิ่มเพื่อน</button>
            <button class="secondary-btn" onclick="document.getElementById('addFriendModal').style.display='none'">ปิด</button>
        </div>
    </div>

    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <h3>ตั้งค่าโปรไฟล์</h3>
             <div style="text-align:center; margin-bottom:15px;">
                <div id="settingAvatarPreview" class="avatar" style="width:80px; height:80px; margin:0 auto; font-size:40px;"><i class="fas fa-user"></i></div>
                <label for="profileUpload" style="display:block; margin-top:10px; color:var(--primary-color); cursor:pointer; font-size:14px; text-decoration:underline;">เปลี่ยนรูปโปรไฟล์</label>
                <input type="file" id="profileUpload" accept="image/*" style="display:none;" onchange="uploadProfile(this)">
            </div>

            <p style="font-size:14px; font-weight:bold; margin-bottom:5px;">เปลี่ยนธีมสี</p>
            <div class="theme-selector">
                <div class="color-dot" style="background:#4a90e2" onclick="changeTheme('#4a90e2')"></div>
                <div class="color-dot" style="background:#e24a4a" onclick="changeTheme('#e24a4a')"></div>
                <div class="color-dot" style="background:#4ae296" onclick="changeTheme('#4ae296')"></div>
                <div class="color-dot" style="background:#8e4ae2" onclick="changeTheme('#8e4ae2')"></div>
                <div class="color-dot" style="background:#333333" onclick="changeTheme('#333333')"></div>
            </div>
            <p style="font-size:14px; font-weight:bold; margin-bottom:5px;">ประวัติการเข้าสู่ระบบ</p>
            <div id="loginHistoryList" class="history-list">Loading...</div>
            <button onclick="requestNotifPermission()" style="margin-bottom:5px;">🔔 เปิดการแจ้งเตือน</button>
            <button style="background:#d9534f;" onclick="kickOtherSessions()">🔒 เตะอุปกรณ์อื่นออก</button>
            <hr style="margin: 15px 0; border:0; border-top:1px solid #eee;">
            <button onclick="logout()">ออกจากระบบ</button>
            <button class="secondary-btn" onclick="document.getElementById('settingsModal').style.display='none'">ปิด</button>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyAttTgBuOobClJZYheeEQNCRYnS8ZwRMh4",
            authDomain: "fluke-1e8d0.firebaseapp.com",
            projectId: "fluke-1e8d0",
            storageBucket: "fluke-1e8d0.firebasestorage.app",
            messagingSenderId: "552744537724",
            appId: "1:552744537724:web:222e2c2e36141dee3a83f9",
            measurementId: "G-RBLW8C6BY9"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const rtcConfig = { iceServers: [{ urls: ['stun:stun1.l.google.com:19302'] }], iceCandidatePoolSize: 10 };

        let currentUser = null;
        let currentChatId = null;
        let pc = null;
        let localStream = null;

        // --- AUTH & SETUP ---
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                loadUserData();
                loadFriends();
                listenForIncomingCalls();
                logSession();
                showScreen('chatScreen');
                document.getElementById('chatScreen').style.display = 'grid';
                requestNotifPermission();
                const savedTheme = localStorage.getItem('chatTheme');
                if(savedTheme) changeTheme(savedTheme);
            } else {
                currentUser = null;
                showScreen('loginScreen');
                document.getElementById('chatScreen').style.display = 'none';
            }
        });

        async function login() {
            try {
                await auth.signInWithEmailAndPassword(document.getElementById('loginEmail').value, document.getElementById('loginPass').value);
                await db.collection('users').doc(auth.currentUser.uid).update({ sessionId: Date.now() });
            } catch (error) { document.getElementById('loginError').innerText = "อีเมลหรือรหัสผ่านไม่ถูกต้อง"; }
        }

        async function register() {
            try {
                const uidName = document.getElementById('regUid').value.trim();
                if (!uidName.startsWith('@')) return alert("ไอดีต้องมี @");
                const check = await db.collection('users').where('username', '==', uidName).get();
                if(!check.empty) return alert("ชื่อไอดีนี้มีคนใช้แล้ว");
                const cred = await auth.createUserWithEmailAndPassword(document.getElementById('regEmail').value, document.getElementById('regPass').value);
                await db.collection('users').doc(cred.user.uid).set({
                    username: uidName, nickname: document.getElementById('regNickname').value, email: document.getElementById('regEmail').value, uid: cred.user.uid, sessionId: Date.now()
                });
                alert("สมัครสมาชิกสำเร็จ!");
            } catch (error) { document.getElementById('regError').innerText = error.message; }
        }

        function resetPassword() {
            const email = prompt("ใส่อีเมลของคุณ:");
            if(email) auth.sendPasswordResetEmail(email).then(()=>alert("ส่งลิงก์ไปที่เมลแล้ว")).catch(e=>alert(e.message));
        }
        function logout() { auth.signOut(); }
        function logSession() {
            if(!currentUser) return;
            db.collection('users').doc(currentUser.uid).collection('loginHistory').add({ timestamp: firebase.firestore.FieldValue.serverTimestamp(), device: navigator.userAgent });
        }

        // --- IMAGE HANDLING ---
        function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 500; 
                        const scaleSize = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * scaleSize;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    }
                }
            });
        }
        async function uploadProfile(input) {
            if (input.files && input.files[0]) {
                const base64 = await compressImage(input.files[0]);
                await db.collection('users').doc(currentUser.uid).update({ avatar: base64 });
                loadUserData(); alert("เปลี่ยนรูปโปรไฟล์เรียบร้อย!");
            }
        }
        async function sendImage(input) {
            if (input.files && input.files[0] && currentChatId) {
                const base64 = await compressImage(input.files[0]);
                await db.collection('chats').doc(currentChatId).collection('messages').add({ image: base64, senderId: currentUser.uid, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
                await db.collection('chats').doc(currentChatId).update({ lastMessage: 'ส่งรูปภาพ...', lastSenderId: currentUser.uid, lastUpdated: firebase.firestore.FieldValue.serverTimestamp() });
            }
            input.value = "";
        }

        // --- CORE LOGIC ---
        function loadUserData() {
            db.collection('users').doc(currentUser.uid).get().then(doc => {
                const data = doc.data();
                document.getElementById('myProfileDisplay').innerHTML = `${data.nickname} <span style="font-size:12px; font-weight:normal; opacity:0.8;">(${data.username})</span>`;
                const avatarHTML = data.avatar ? `<img src="${data.avatar}">` : `<i class="fas fa-user"></i>`;
                document.getElementById('myAvatarDisplay').innerHTML = avatarHTML;
                document.getElementById('settingAvatarPreview').innerHTML = avatarHTML;
            });
        }

        function loadFriends() {
            db.collection('chats').where('participants', 'array-contains', currentUser.uid).onSnapshot(snapshot => {
                let chatsArray = [];
                snapshot.forEach(doc => { chatsArray.push({ id: doc.id, ...doc.data() }); });
                
                // เรียงลำดับแชทตามเวลา (ล่าสุดอยู่บน)
                chatsArray.sort((a, b) => {
                    const timeA = a.lastUpdated ? a.lastUpdated.toMillis() : 0;
                    const timeB = b.lastUpdated ? b.lastUpdated.toMillis() : 0;
                    return timeB - timeA;
                });

                const list = document.getElementById('friendsList');
                list.innerHTML = "";
                
                // Logic แจ้งเตือน
                snapshot.docChanges().forEach(async change => {
                    if(change.type==='modified'){
                        const d=change.doc.data();
                        if(d.lastSenderId && d.lastSenderId!==currentUser.uid){
                            const now=Date.now(); const t=d.lastUpdated?d.lastUpdated.toMillis():0;
                            if(now-t<10000 && currentChatId!==change.doc.id){
                                const fid=d.participants.find(id=>id!==currentUser.uid);
                                const fDoc=await db.collection('users').doc(fid).get();
                                notifyUser(fDoc.data().nickname, d.lastMessage);
                            }
                        }
                    }
                });

                chatsArray.forEach(async data => {
                    const friendUid = data.participants.find(id => id !== currentUser.uid);
                    const fDoc = await db.collection('users').doc(friendUid).get();
                    const fData = fDoc.data();
                    
                    // แปลงเวลา
                    let timeStr = "";
                    if(data.lastUpdated) {
                        const date = data.lastUpdated.toDate();
                        const today = new Date();
                        if(date.toDateString() === today.toDateString()) {
                             timeStr = date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                        } else {
                             timeStr = date.toLocaleDateString();
                        }
                    }

                    const div = document.createElement('div');
                    div.className = 'user-item';
                    if(currentChatId === data.id) div.classList.add('active');
                    
                    const fAvatar = fData.avatar ? `<img src="${fData.avatar}">` : `<i class="fas fa-user"></i>`;

                    // Layout รายชื่อเพื่อน (แก้ UI ตามสั่ง)
                    div.innerHTML = `
                        <div class="avatar">${fAvatar}</div>
                        <div class="user-details">
                            <div class="user-row-top">
                                <div>
                                    <span class="user-name">${fData.nickname}</span>
                                    <span class="user-uid">${fData.username}</span>
                                </div>
                                <div class="msg-time">${timeStr}</div>
                            </div>
                            <div class="last-msg">${data.lastMessage || 'เริ่มการสนทนา'}</div>
                        </div>
                    `;
                    div.onclick = () => openChat(data.id, fData);
                    list.appendChild(div);
                });
            });
        }

        function openChat(chatId, friendData) {
            currentChatId = chatId;
            if(window.innerWidth <= 600) document.getElementById('chatArea').classList.add('active');
            document.getElementById('chatTitle').innerHTML = `${friendData.nickname} <small>(${friendData.username})</small>`;
            document.getElementById('callBtn').style.display = 'block';
            document.getElementById('msgInput').disabled = false;
            document.getElementById('sendBtn').disabled = false;
            
            db.collection('chats').doc(chatId).collection('messages').orderBy('timestamp', 'asc').onSnapshot(snap => {
                const div = document.getElementById('messagesList');
                div.innerHTML = "";
                snap.forEach(d => {
                    const m = d.data();
                    let content = m.image ? `<img src="${m.image}" class="chat-image" onclick="window.open(this.src)">` : m.text;
                    div.innerHTML += `<div class="message ${m.senderId===currentUser.uid?'my-msg':'their-msg'}">${content}</div>`;
                });
                div.scrollTop = div.scrollHeight;
            });
        }

        async function sendMessage() {
            const txt = document.getElementById('msgInput').value;
            if(!txt || !currentChatId) return;
            await db.collection('chats').doc(currentChatId).collection('messages').add({ text: txt, senderId: currentUser.uid, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
            await db.collection('chats').doc(currentChatId).update({ lastMessage: txt, lastSenderId: currentUser.uid, lastUpdated: firebase.firestore.FieldValue.serverTimestamp() });
            document.getElementById('msgInput').value = "";
        }

        // --- SETTINGS ---
        function openSettings() {
            document.getElementById('settingsModal').style.display = 'flex';
            const list = document.getElementById('loginHistoryList');
            list.innerHTML = "Loading...";
            db.collection('users').doc(currentUser.uid).collection('loginHistory')
                .orderBy('timestamp', 'desc').limit(5).get().then(snap => {
                    list.innerHTML = "";
                    snap.forEach(doc => {
                        const data = doc.data();
                        const date = data.timestamp ? data.timestamp.toDate().toLocaleString() : 'Now';
                        list.innerHTML += `<div class="history-item">${date} <br> <span style="font-size:10px; color:#999;">${data.device}</span></div>`;
                    });
                });
        }
        function changeTheme(color) { document.documentElement.style.setProperty('--primary-color', color); localStorage.setItem('chatTheme', color); }
        async function kickOtherSessions() { await db.collection('users').doc(currentUser.uid).update({ sessionId: Date.now() }); alert('รีเซ็ต Session เรียบร้อย!'); }

        // --- NOTIFICATIONS & UTILS ---
        function requestNotifPermission() { if("Notification" in window && Notification.permission !== "granted") Notification.requestPermission(); }
        function notifyUser(senderName, message) {
            const sound = document.getElementById('notifSound');
            if(sound) { sound.currentTime = 0; sound.play().catch(e => {}); }
            if ((document.hidden || !document.hasFocus()) && Notification.permission === "granted") {
                new Notification(senderName, { body: message });
            }
        }
        function showScreen(id) { document.querySelectorAll('.container').forEach(d=>d.style.display='none'); document.querySelectorAll('.active-screen').forEach(d=>d.classList.remove('active-screen')); document.getElementById(id).style.display = (id==='chatScreen')?'grid':'block'; }
        function openAddFriendModal() { document.getElementById('addFriendModal').style.display='flex'; }
        function closeChatMobile() { document.getElementById('chatArea').classList.remove('active'); }
        async function addFriend() {
            const val = document.getElementById('addFriendInput').value;
            let q = val.includes('@') ? db.collection('users').where('username','==',val) : db.collection('users').where('email','==',val);
            const snap = await q.get();
            if(snap.empty) return alert('ไม่พบ');
            const uid = snap.docs[0].id;
            if(uid === currentUser.uid) return alert('เพิ่มตัวเองไม่ได้');
            const ex = await db.collection('chats').where('participants','array-contains',currentUser.uid).get();
            let found = false;
            ex.forEach(d => { if(d.data().participants.includes(uid)) found = true; });
            if(!found) {
                await db.collection('chats').add({ participants:[currentUser.uid, uid], lastMessage:'', lastUpdated: firebase.firestore.FieldValue.serverTimestamp() });
                alert('เพิ่มแล้ว'); document.getElementById('addFriendModal').style.display='none';
            } else { alert('มีเพื่อนคนนี้แล้ว'); }
        }
        function onTyping() {}

        // --- VIDEO CALL ---
        async function startCallClick() {
            document.getElementById('videoCallModal').style.display = 'flex';
            document.getElementById('callStatusText').innerText = "กำลังเริ่มกล้อง...";
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('localVideo').srcObject = localStream;
            document.getElementById('remoteVideo').srcObject = new MediaStream();
            pc = new RTCPeerConnection(rtcConfig);
            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            pc.ontrack = event => event.streams[0].getTracks().forEach(track => document.getElementById('remoteVideo').srcObject.addTrack(track));
            const callDoc = db.collection('chats').doc(currentChatId).collection('calls').doc();
            pc.onicecandidate = event => { if(event.candidate) callDoc.collection('offerCandidates').add(event.candidate.toJSON()); };
            const offerDescription = await pc.createOffer();
            await pc.setLocalDescription(offerDescription);
            await callDoc.set({ offer: {sdp: offerDescription.sdp, type: offerDescription.type}, callerId: currentUser.uid });
            document.getElementById('callStatusText').innerText = "กำลังโทรออก...";
            callDoc.onSnapshot(snapshot => {
                const data = snapshot.data();
                if (!pc.currentRemoteDescription && data?.answer) { pc.setRemoteDescription(new RTCSessionDescription(data.answer)); document.getElementById('callStatusText').innerText = "เชื่อมต่อแล้ว!"; }
            });
            window.currentCallId = callDoc.id;
        }
        function listenForIncomingCalls() {
            db.collection('chats').where('participants', 'array-contains', currentUser.uid).onSnapshot(snapshot => {
                snapshot.forEach(doc => {
                    db.collection('chats').doc(doc.id).collection('calls').where('offer', '!=', null).onSnapshot(callSnap => {
                        callSnap.docChanges().forEach(change => {
                            if (change.type === 'added') {
                                const data = change.doc.data();
                                if (data.callerId !== currentUser.uid && !data.answer) { showIncomingCall(doc.id, change.doc.id, data.callerId); notifyUser("สายเข้า...", "วิดีโอคอลเข้ามา"); }
                            }
                        });
                    });
                });
            });
        }
        async function showIncomingCall(chatId, callId, callerUid) {
            const callerDoc = await db.collection('users').doc(callerUid).get();
            document.getElementById('incomingCallerName').innerText = callerDoc.data().nickname;
            document.getElementById('incomingCallAlert').style.display = 'flex';
            window.incomingCallData = { chatId, callId };
        }
        async function answerCall() {
            document.getElementById('incomingCallAlert').style.display = 'none';
            document.getElementById('videoCallModal').style.display = 'flex';
            const { chatId, callId } = window.incomingCallData;
            window.currentCallId = callId; currentChatId = chatId;
            const callDoc = db.collection('chats').doc(chatId).collection('calls').doc(callId);
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('localVideo').srcObject = localStream;
            document.getElementById('remoteVideo').srcObject = new MediaStream();
            pc = new RTCPeerConnection(rtcConfig);
            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            pc.ontrack = event => event.streams[0].getTracks().forEach(track => document.getElementById('remoteVideo').srcObject.addTrack(track));
            pc.onicecandidate = event => { if(event.candidate) callDoc.collection('answerCandidates').add(event.candidate.toJSON()); };
            const callData = (await callDoc.get()).data();
            await pc.setRemoteDescription(new RTCSessionDescription(callData.offer));
            const answerDescription = await pc.createAnswer();
            await pc.setLocalDescription(answerDescription);
            await callDoc.update({ answer: {type: answerDescription.type, sdp: answerDescription.sdp} });
            document.getElementById('callStatusText').innerText = "เชื่อมต่อแล้ว!";
            callDoc.collection('offerCandidates').onSnapshot(snapshot => snapshot.docChanges().forEach(change => { if (change.type === 'added') pc.addIceCandidate(new RTCIceCandidate(change.doc.data())); }));
        }
        function rejectCall() { document.getElementById('incomingCallAlert').style.display = 'none'; }
        async function hangUp() {
            if(localStream) localStream.getTracks().forEach(track => track.stop());
            if(pc) pc.close();
            pc = null; localStream = null;
            document.getElementById('videoCallModal').style.display = 'none';
            if(window.currentCallId && currentChatId) await db.collection('chats').doc(currentChatId).collection('calls').doc(window.currentCallId).delete();
            window.location.reload();
        }
    </script>
</body>
</html>
