<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Chat App (@Username Version)</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-color: #4a90e2;
            --bg-color: #f0f2f5;
            --chat-bg: #ffffff;
            --text-color: #333;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        /* Containers */
        .container { width: 100%; max-width: 400px; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: none; }
        .active-screen { display: block; }
        
        /* Chat Layout */
        #chatScreen { max-width: 900px; width: 90%; height: 90vh; display: none; grid-template-columns: 300px 1fr; overflow: hidden; padding: 0; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); background: white; }
        .sidebar { background: #f7f7f7; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
        .chat-area { display: flex; flex-direction: column; background: var(--chat-bg); position: relative; }

        /* Forms */
        h2 { text-align: center; color: var(--text-color); }
        h3 { margin-top: 0; color: var(--primary-color); text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; outline: none; }
        input:focus { border-color: var(--primary-color); }
        
        button { width: 100%; padding: 12px; background: var(--primary-color); color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 10px; transition: 0.2s; }
        button:hover { opacity: 0.9; }
        .secondary-btn { background: #ccc; color: #333; }
        
        /* Buttons */
        .icon-btn { width: 40px; height: 40px; border-radius: 50%; padding: 0; display: flex; justify-content: center; align-items: center; font-size: 18px; margin: 0 0 0 5px; background: white; color: var(--primary-color); box-shadow: 0 2px 5px rgba(0,0,0,0.1); cursor: pointer; border: none; }
        .icon-btn:hover { background: #f0f0f0; }
        .link-text { text-align: center; margin-top: 15px; font-size: 14px; cursor: pointer; color: var(--primary-color); }

        /* User List Items */
        .header { padding: 15px; background: var(--primary-color); color: white; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); z-index: 10; }
        .user-list { flex: 1; overflow-y: auto; }
        .user-item { padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: background 0.2s; }
        .user-item:hover, .user-item.active { background: #eef; }
        
        /* Chat Messages */
        .messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #f9f9f9; }
        .message { padding: 10px 15px; border-radius: 15px; max-width: 70%; word-wrap: break-word; font-size: 14px; line-height: 1.4; }
        .my-msg { align-self: flex-end; background: var(--primary-color); color: white; border-bottom-right-radius: 2px; }
        .their-msg { align-self: flex-start; background: #e0e0e0; color: #333; border-bottom-left-radius: 2px; }
        
        .input-area { padding: 10px 15px; background: white; border-top: 1px solid #ddd; display: flex; gap: 10px; align-items: center; }
        .typing-indicator { font-size: 12px; color: #888; margin-left: 20px; min-height: 20px; font-style: italic; display: flex; align-items: center; }

        /* Modals */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 350px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); animation: popUp 0.3s ease; }
        @keyframes popUp { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .history-item { font-size: 12px; border-bottom: 1px solid #eee; padding: 8px 0; color: #555; }
        .theme-selector { display: flex; gap: 10px; margin: 15px 0; justify-content: center; }
        .color-dot { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid #fff; box-shadow: 0 0 3px rgba(0,0,0,0.3); transition: transform 0.2s; }
        .error { color: #d9534f; font-size: 13px; text-align: center; margin-top: 5px; }
        
        /* Mobile Responsive */
        @media (max-width: 600px) {
            #chatScreen { width: 100%; height: 100%; border-radius: 0; grid-template-columns: 1fr; }
            .sidebar { display: flex; width: 100%; height: 100%; }
            .chat-area { display: none; width: 100%; height: 100%; position: absolute; top:0; left:0; z-index: 20; }
            .chat-area.active { display: flex; }
            .back-btn { display: inline-block !important; margin-right: 10px; cursor: pointer; }
        }
        .back-btn { display: none; color: white; font-size: 18px; }
    </style>
</head>
<body>

    <div id="loginScreen" class="container active-screen">
        <h2>เข้าสู่ระบบ</h2>
        <input type="email" id="loginEmail" placeholder="อีเมล">
        <input type="password" id="loginPass" placeholder="รหัสผ่าน">
        <button onclick="login()">เข้าสู่ระบบ</button>
        <p class="link-text" onclick="showScreen('registerScreen')">ยังไม่มีบัญชี? สร้างบัญชีใหม่</p>
        <p id="loginError" class="error"></p>
    </div>

    <div id="registerScreen" class="container">
        <h2>สร้างบัญชีใหม่</h2>
        <input type="text" id="regUid" placeholder="ชื่อไอดี (@username)" pattern="^@.*" title="ต้องขึ้นต้นด้วย @">
        <input type="text" id="regNickname" placeholder="ชื่อเล่น">
        <input type="email" id="regEmail" placeholder="อีเมล">
        <input type="password" id="regPass" placeholder="รหัสผ่าน (6 ตัวขึ้นไป)">
        <input type="password" id="regConfirmPass" placeholder="ยืนยันรหัสผ่าน">
        <button onclick="register()">สมัครสมาชิก</button>
        <button class="secondary-btn" onclick="showScreen('loginScreen')">กลับไปหน้าล็อกอิน</button>
        <p id="regError" class="error"></p>
    </div>

    <div id="chatScreen">
        <div class="sidebar">
            <div class="header">
                <div style="display: flex; align-items: center; gap: 10px; overflow: hidden;">
                    <span id="myProfileDisplay" style="font-weight:bold; white-space: nowrap;">Loading...</span>
                </div>
                <div style="display:flex;">
                    <button class="icon-btn" onclick="openAddFriendModal()" title="เพิ่มเพื่อน"><i class="fas fa-plus"></i></button>
                    <button class="icon-btn" onclick="openSettings()" title="ตั้งค่า"><i class="fas fa-cog"></i></button>
                </div>
            </div>
            
            <div id="friendsList" class="user-list"></div>
        </div>

        <div id="chatArea" class="chat-area">
            <div class="header" id="chatHeader" style="background: white; color: #333; border-bottom: 1px solid #ddd;">
                <div style="display:flex; align-items:center;">
                    <i class="fas fa-arrow-left back-btn" style="color:#333;" onclick="closeChatMobile()"></i>
                    <span id="chatTitle">เลือกเพื่อนเพื่อเริ่มคุย</span>
                </div>
            </div>
            <div id="messagesList" class="messages"></div>
            <div id="typingIndicator" class="typing-indicator"></div>
            <div class="input-area">
                <input type="text" id="msgInput" placeholder="พิมพ์ข้อความ..." disabled oninput="onTyping()">
                <button onclick="sendMessage()" style="width: auto; margin:0; padding: 10px 20px;" id="sendBtn" disabled><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <div id="addFriendModal" class="modal">
        <div class="modal-content">
            <h3><i class="fas fa-user-plus"></i> เพิ่มเพื่อนใหม่</h3>
            <p style="text-align:center; font-size:14px; color:#666; margin-bottom:15px;">ค้นหาเพื่อนด้วย @username หรือ Email</p>
            <input type="text" id="addFriendInput" placeholder="เช่น @somchai หรือ email@test.com">
            <button onclick="addFriend()">เพิ่มเพื่อน</button>
            <button class="secondary-btn" onclick="document.getElementById('addFriendModal').style.display='none'">ยกเลิก</button>
        </div>
    </div>

    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <h3>การตั้งค่า</h3>
            <p style="font-size:14px; font-weight:bold; margin-bottom:5px;">เปลี่ยนธีมสี</p>
            <div class="theme-selector">
                <div class="color-dot" style="background:#4a90e2" onclick="changeTheme('#4a90e2')"></div>
                <div class="color-dot" style="background:#e24a4a" onclick="changeTheme('#e24a4a')"></div>
                <div class="color-dot" style="background:#4ae296" onclick="changeTheme('#4ae296')"></div>
                <div class="color-dot" style="background:#8e4ae2" onclick="changeTheme('#8e4ae2')"></div>
                <div class="color-dot" style="background:#333333" onclick="changeTheme('#333333')"></div>
            </div>
            <p style="font-size:14px; font-weight:bold; margin-bottom:5px;">ประวัติการเข้าสู่ระบบ</p>
            <div id="loginHistoryList" style="max-height: 100px; overflow-y: auto; margin-bottom: 15px; background:#f9f9f9; padding:5px; border-radius:5px;"></div>
            <button class="secondary-btn" style="background:#d9534f; color:white;" onclick="kickOtherSessions()"><i class="fas fa-shield-alt"></i> เตะอุปกรณ์อื่นออก</button>
            <hr style="margin: 15px 0; border:0; border-top:1px solid #eee;">
            <button onclick="logout()">ออกจากระบบ</button>
            <button class="secondary-btn" onclick="closeSettings()">ปิด</button>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyAttTgBuOobClJZYheeEQNCRYnS8ZwRMh4",
            authDomain: "fluke-1e8d0.firebaseapp.com",
            projectId: "fluke-1e8d0",
            storageBucket: "fluke-1e8d0.firebasestorage.app",
            messagingSenderId: "552744537724",
            appId: "1:552744537724:web:222e2c2e36141dee3a83f9",
            measurementId: "G-RBLW8C6BY9"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let currentChatId = null;
        let typingTimeout = null;

        // --- 2. AUTHENTICATION ---
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                loadUserData();
                loadFriends();
                logSession();
                showScreen('chatScreen');
                document.getElementById('chatScreen').style.display = 'grid';
            } else {
                currentUser = null;
                showScreen('loginScreen');
                document.getElementById('chatScreen').style.display = 'none';
            }
        });

        async function register() {
            const uidName = document.getElementById('regUid').value.trim();
            const nickname = document.getElementById('regNickname').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const pass = document.getElementById('regPass').value;
            const confirmPass = document.getElementById('regConfirmPass').value;

            if (pass !== confirmPass) return alert("รหัสผ่านไม่ตรงกัน");
            if (!uidName.startsWith('@')) return alert("ชื่อไอดีต้องขึ้นต้นด้วย @");

            try {
                // ต้องเปิด Permission Rules ใน Firebase ก่อนถึงจะเช็คได้
                const snapshot = await db.collection('users').where('username', '==', uidName).get();
                if (!snapshot.empty) throw new Error("ชื่อไอดีนี้มีคนใช้แล้ว");

                const userCred = await auth.createUserWithEmailAndPassword(email, pass);
                await db.collection('users').doc(userCred.user.uid).set({
                    username: uidName,
                    nickname: nickname,
                    email: email,
                    uid: userCred.user.uid,
                    sessionId: Date.now()
                });
                alert("สมัครสมาชิกสำเร็จ!");
            } catch (error) {
                document.getElementById('regError').innerText = error.message;
            }
        }

        async function login() {
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;
            try {
                await auth.signInWithEmailAndPassword(email, pass);
                await db.collection('users').doc(auth.currentUser.uid).update({ sessionId: Date.now() });
            } catch (error) {
                document.getElementById('loginError').innerText = "อีเมลหรือรหัสผ่านไม่ถูกต้อง";
            }
        }

        function logout() { auth.signOut(); }

        function logSession() {
            if(!currentUser) return;
            db.collection('users').doc(currentUser.uid).collection('loginHistory').add({
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                device: navigator.userAgent
            });
        }

        async function kickOtherSessions() {
            if(!currentUser) return;
            await db.collection('users').doc(currentUser.uid).update({ sessionId: Date.now() });
            alert("รีเซ็ต Session เรียบร้อย!");
        }

        // --- 3. CHAT LOGIC ---
        function loadUserData() {
            db.collection('users').doc(currentUser.uid).get().then(doc => {
                const data = doc.data();
                document.getElementById('myProfileDisplay').innerHTML = `${data.nickname} <small style='opacity:0.8'>${data.username}</small>`;
            });
        }

        function openAddFriendModal() {
            document.getElementById('addFriendModal').style.display = 'flex';
        }

        async function addFriend() {
            const input = document.getElementById('addFriendInput').value.trim();
            if(!input) return;

            try {
                let query;
                if (input.includes('@')) {
                    query = db.collection('users').where('username', '==', input);
                } else {
                    query = db.collection('users').where('email', '==', input);
                }

                const snapshot = await query.get();
                if (snapshot.empty) return alert("ไม่พบผู้ใช้");

                const friendData = snapshot.docs[0].data();
                if (friendData.uid === currentUser.uid) return alert("เพิ่มตัวเองไม่ได้");
                
                const chatCheck = await db.collection('chats').where('participants', 'array-contains', currentUser.uid).get();
                let existingChat = null;
                chatCheck.forEach(doc => {
                    const data = doc.data();
                    if (data.participants.includes(friendData.uid)) existingChat = doc.id;
                });

                if (!existingChat) {
                    await db.collection('chats').add({
                        participants: [currentUser.uid, friendData.uid],
                        lastMessage: "",
                        lastUpdated: firebase.firestore.FieldValue.serverTimestamp(),
                        typing: {} 
                    });
                }
                
                alert("เพิ่มเพื่อนเรียบร้อย! (ถ้ายังไม่ขึ้นให้ลองรีเฟรชหน้าเว็บ)");
                document.getElementById('addFriendInput').value = "";
                document.getElementById('addFriendModal').style.display = 'none';
            } catch(e) {
                alert("เกิดข้อผิดพลาด: " + e.message + "\n(กรุณาเช็ค Rules ใน Firebase Console)");
            }
        }

        function loadFriends() {
            // ลบ orderBy ออกเพื่อแก้บั๊กเพื่อนไม่ขึ้น (เพราะยังไม่ได้ทำ Index)
            db.collection('chats').where('participants', 'array-contains', currentUser.uid)
                .onSnapshot(snapshot => {
                    const list = document.getElementById('friendsList');
                    list.innerHTML = "";
                    snapshot.forEach(async doc => {
                        const data = doc.data();
                        const friendUid = data.participants.find(uid => uid !== currentUser.uid);
                        const friendDoc = await db.collection('users').doc(friendUid).get();
                        const friendData = friendDoc.data();

                        const div = document.createElement('div');
                        div.className = 'user-item';
                        if(currentChatId === doc.id) div.classList.add('active');
                        
                        // --- ส่วนที่แก้ไข: เพิ่ม @username เข้าไปแสดงผล ---
                        div.innerHTML = `
                            <div style="display:flex; align-items:center; gap:10px;">
                                <div style="width:40px; height:40px; background:#ddd; border-radius:50%; display:flex; justify-content:center; align-items:center; color:#555;">
                                    <i class="fas fa-user"></i>
                                </div>
                                <div style="overflow:hidden;">
                                    <div style="font-weight:bold; white-space:nowrap;">
                                        ${friendData.nickname} 
                                        <span style="font-size:12px; color:#666; font-weight:normal;">${friendData.username}</span>
                                    </div>
                                    <div style="font-size:12px; color:#888;">${data.lastMessage || 'เริ่มการสนทนา'}</div>
                                </div>
                            </div>
                            <div style="font-size:18px; color:#ccc;">›</div>
                        `;
                        // ------------------------------------------------
                        
                        div.onclick = () => openChat(doc.id, friendData);
                        list.appendChild(div);
                    });
                });
        }

        function openChat(chatId, friendData) {
            currentChatId = chatId;
            
            if(window.innerWidth <= 600) {
                document.getElementById('chatArea').classList.add('active');
            }

            document.getElementById('chatTitle').innerHTML = `${friendData.nickname} <small>(${friendData.username})</small>`;
            document.getElementById('msgInput').disabled = false;
            document.getElementById('sendBtn').disabled = false;
            
            document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));

            db.collection('chats').doc(chatId).collection('messages')
                .orderBy('timestamp', 'asc')
                .onSnapshot(snapshot => {
                    const msgList = document.getElementById('messagesList');
                    msgList.innerHTML = "";
                    snapshot.forEach(doc => {
                        const msg = doc.data();
                        const div = document.createElement('div');
                        div.className = `message ${msg.senderId === currentUser.uid ? 'my-msg' : 'their-msg'}`;
                        div.innerText = msg.text;
                        msgList.appendChild(div);
                    });
                    msgList.scrollTop = msgList.scrollHeight;
                });

            db.collection('chats').doc(chatId).onSnapshot(doc => {
                const data = doc.data();
                const typingStatus = document.getElementById('typingIndicator');
                const otherUid = friendData.uid;
                if (data.typing && data.typing[otherUid]) {
                    typingStatus.innerText = `${friendData.nickname} กำลังพิมพ์...`;
                } else {
                    typingStatus.innerText = "";
                }
            });
        }

        function closeChatMobile() {
            document.getElementById('chatArea').classList.remove('active');
            currentChatId = null;
        }

        async function sendMessage() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text || !currentChatId) return;

            await db.collection('chats').doc(currentChatId).collection('messages').add({
                text: text,
                senderId: currentUser.uid,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });

            await db.collection('chats').doc(currentChatId).update({
                lastMessage: text,
                lastUpdated: firebase.firestore.FieldValue.serverTimestamp(),
                [`typing.${currentUser.uid}`]: false
            });

            input.value = "";
        }

        function onTyping() {
            if (!currentChatId) return;
            db.collection('chats').doc(currentChatId).update({ [`typing.${currentUser.uid}`]: true });
            if (typingTimeout) clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                db.collection('chats').doc(currentChatId).update({ [`typing.${currentUser.uid}`]: false });
            }, 2000);
        }

        // --- Utilities ---
        function showScreen(id) {
            document.querySelectorAll('.container').forEach(d => d.style.display = 'none');
            document.querySelectorAll('.active-screen').forEach(d => d.classList.remove('active-screen'));
            const target = document.getElementById(id);
            if(id === 'chatScreen') target.style.display = 'grid';
            else target.style.display = 'block';
        }

        function openSettings() {
            document.getElementById('settingsModal').style.display = 'flex';
            const list = document.getElementById('loginHistoryList');
            list.innerHTML = "Loading...";
            db.collection('users').doc(currentUser.uid).collection('loginHistory')
                .orderBy('timestamp', 'desc').limit(5).get().then(snap => {
                    list.innerHTML = "";
                    snap.forEach(doc => {
                        const data = doc.data();
                        const date = data.timestamp ? data.timestamp.toDate().toLocaleString() : 'Now';
                        list.innerHTML += `<div class="history-item">${date} - ${data.device}</div>`;
                    });
                });
        }
        function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }
        
        function changeTheme(color) {
            document.documentElement.style.setProperty('--primary-color', color);
            localStorage.setItem('chatTheme', color);
        }
        const savedTheme = localStorage.getItem('chatTheme');
        if(savedTheme) changeTheme(savedTheme);

    </script>
</body>
</html>
